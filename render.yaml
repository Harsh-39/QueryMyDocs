services:
  - type: web
    name: querymydocs-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: ELASTIC_CLOUD_ID
        sync: false
      - key: ELASTIC_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX
        sync: false
      - key: TOKENROUTER_API_KEY
        sync: false
      - key: TOKENROUTER_BASE_URL
        value: https://api.tokenrouter.com/v1
      - key: TOKENROUTER_MODEL
        value: qwen/qwen3.8-max
